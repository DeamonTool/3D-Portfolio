<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer Example</title>
    <!-- Подключаем библиотеку model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        /* Простой стиль для центрирования модели на странице */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        model-viewer {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Внедряем модель с помощью model-viewer -->
    <model-viewer src="Models/HALO360_Onyx_Static_c.glb" 
                  alt="A 3D model of an object" 
                  auto-rotate 
                  camera-controls 
                  ar>
    </model-viewer>
</body>
</html>
